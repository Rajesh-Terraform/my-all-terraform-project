name: Phase 2 - Spoke VPC


on:
  push:
    branches:
      - main


  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase2-spoke:
    name: Spoke VPC
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase2-spoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Phase 1 - Apply spoke VPC
        run: terraform apply -auto-approve phase1.tfplan

  
