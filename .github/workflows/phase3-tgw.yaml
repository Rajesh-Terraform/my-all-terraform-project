name: Phase 3 - TGW

on:
  push:
    branches:
      - main



  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase3-tgw:
    name: Transit Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-tgw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Hub AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Destroy tgw
        run: terraform destroy -auto-approve