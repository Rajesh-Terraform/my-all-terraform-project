name: Terraform Hub-Spoke Network

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

  
jobs:

  # ==========================================================
  # PHASE 1 - HUB VPC
  # ==========================================================

  phase1-hub:
    name: Phase 1 - Hub VPC
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/hub/phase1-hubvpc

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::647132523867:role/github-actions-terraform-role-v1"
          aws-region: "ap-south-1"

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ==========================================================
  # PHASE 2 - SPOKE VPC
  # ==========================================================

  phase2-spoke:
    name: Phase 2 - Spoke VPC
    runs-on: ubuntu-latest

    needs:
      - phase1-hub

    defaults:
      run:
        working-directory: terraform/spoke/phase2-spokevpc

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: "ap-south-1"

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ==========================================================
  # PHASE 3 - HUB TGW + RAM
  # ==========================================================

  phase3-tgw:
    name: Phase 3 - Hub TGW + RAM
    runs-on: ubuntu-latest

    needs:
      - phase1-hub
      - phase2-spoke

    defaults:
      run:
        working-directory: terraform/hub/phase3-tgw

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::647132523867:role/github-actions-terraform-role-v1"
          aws-region: ap-south-1

      - name: Verify Hub AWS account
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_spoke_account_id: ${{ env.SPOKE_ACCOUNT_ID }}
          TF_VAR_spoke_vpc_cidr: "10.1.0.0/16"
        run: terraform plan

      - name: Terraform Apply
        env:
          TF_VAR_spoke_account_id: ${{ env.SPOKE_ACCOUNT_ID }}
          TF_VAR_spoke_vpc_cidr: "10.1.0.0/16"
        run: terraform apply -auto-approve

      - name: Get TGW ID
        id: tgw
        env:
          TF_VAR_spoke_account_id: ${{ env.SPOKE_ACCOUNT_ID }}
          TF_VAR_spoke_vpc_cidr: "10.1.0.0/16"
        run: |
          TGW_ID=$(terraform output -raw transit_gateway_id)

          echo "TGW_ID=$TGW_ID" >> "$GITHUB_OUTPUT"

          echo "Created TGW: $TGW_ID"


  # ==========================================================
  # PHASE 3 - SPOKE ATTACHMENT
  # ==========================================================

  phase3-attachment:
    name: Phase 3 - Spoke TGW Attachment
    runs-on: ubuntu-latest

    needs:
      - phase3-tgw

    defaults:
      run:
        working-directory: terraform/spoke/phase3-attachment

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          
          
          aws-region: ap-south-1

      - name: Verify Spoke AWS account
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Find Hub TGW
        id: tgw
        run: |
          TGW_ID=$(aws ec2 describe-transit-gateways \
            --region "$AWS_REGION" \
            --filters \
              "Name=state,Values=available" \
            --query "TransitGateways[?OwnerId=='$HUB_ACCOUNT_ID'].TransitGatewayId | [0]" \
            --output text)

          if [ "$TGW_ID" = "None" ] || [ -z "$TGW_ID" ]; then
            echo "ERROR: Hub TGW was not found."
            exit 1
          fi

          echo "TGW_ID=$TGW_ID"
          echo "TGW_ID=$TGW_ID" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ steps.tgw.outputs.TGW_ID }}
          TF_VAR_hub_vpc_cidr: "10.0.0.0/16"
        run: terraform plan

      - name: Terraform Apply
        env:
          TF_VAR_transit_gateway_id: ${{ steps.tgw.outputs.TGW_ID }}
          TF_VAR_hub_vpc_cidr: "10.0.0.0/16"
        run: terraform apply -auto-approve

      - name: Show attachment
        run: |
          terraform output   