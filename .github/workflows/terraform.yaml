name: Terraform Hub Spoke Network

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # PHASE 1 - HUB VPC
  # ============================================================

  phase1-hub:
    name: Phase 1 - Hub VPC
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase1-hub

    outputs:
      hub_vpc_id: ${{ steps.outputs.outputs.hub_vpc_id }}
      hub_subnet_id: ${{ steps.outputs.outputs.hub_subnet_id }}
      hub_route_table_id: ${{ steps.outputs.outputs.hub_route_table_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Hub Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      - name: Verify AWS Account
        run: |
          aws sts get-caller-identity

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Read Outputs
        id: outputs
        run: |
          echo "hub_vpc_id=$(terraform output -raw hub_vpc_id)" >> "$GITHUB_OUTPUT"
          echo "hub_subnet_id=$(terraform output -raw hub_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "hub_route_table_id=$(terraform output -raw hub_route_table_id)" >> "$GITHUB_OUTPUT"


  # ============================================================
  # PHASE 2 - SPOKE VPC
  # ============================================================

  phase2-spoke:
    name: Phase 2 - Spoke VPC
    runs-on: ubuntu-latest

    needs: phase1-hub

    defaults:
      run:
        working-directory: phase2-spoke

    outputs:
      spoke_vpc_id: ${{ steps.outputs.outputs.spoke_vpc_id }}
      spoke_subnet_id: ${{ steps.outputs.outputs.spoke_subnet_id }}
      spoke_route_table_id: ${{ steps.outputs.outputs.spoke_route_table_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Spoke Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Verify AWS Account
        run: |
          aws sts get-caller-identity

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Read Outputs
        id: outputs
        run: |
          echo "spoke_vpc_id=$(terraform output -raw spoke_vpc_id)" >> "$GITHUB_OUTPUT"
          echo "spoke_subnet_id=$(terraform output -raw spoke_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "spoke_route_table_id=$(terraform output -raw spoke_route_table_id)" >> "$GITHUB_OUTPUT"


  # ============================================================
  # PHASE 3 - TGW + RAM + ATTACHMENTS
  # ============================================================

  phase3-network:
    name: Phase 3 - TGW RAM Attachments
    runs-on: ubuntu-latest

    needs:
      - phase1-hub
      - phase2-spoke

    defaults:
      run:
        working-directory: phase3-network

    env:
      TF_VAR_hub_vpc_id: ${{ needs.phase1-hub.outputs.hub_vpc_id }}
      TF_VAR_hub_subnet_id: ${{ needs.phase1-hub.outputs.hub_subnet_id }}
      TF_VAR_hub_route_table_id: ${{ needs.phase1-hub.outputs.hub_route_table_id }}

      TF_VAR_spoke_vpc_id: ${{ needs.phase2-spoke.outputs.spoke_vpc_id }}
      TF_VAR_spoke_subnet_id: ${{ needs.phase2-spoke.outputs.spoke_subnet_id }}
      TF_VAR_spoke_route_table_id: ${{ needs.phase2-spoke.outputs.spoke_route_table_id }}

      TF_VAR_spoke_account_id: "434097521299"
      TF_VAR_spoke_role_arn: arn:aws:iam::434097521299:role/testingdummy

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Hub Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1



           arn:aws:iam::434097521299:role/testingdummy    

      - name: Verify Hub Account
        run: |
          aws sts get-caller-identity

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve  